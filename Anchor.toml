[provider]
cluster = "devnet"
wallet = "/home/ilich/.config/solana/id.json"

[programs.devnet]
gaia_recs = "GAIA_RECS_PROGRAM_ID"

[scripts]
test = "yarn run test"
lint = "cargo fmt --all && cargo clippy --all-targets --all-features -- -D warnings"
build = "anchor build"
deploy = "anchor deploy"
verify = "anchor verify"

[registry]
url = "https://anchor.projectserum.com"

[features]
seeds = false
skip-lint = false
test = ["gaia_recs/test"]

[test]
skip-deploy = false
skip-local-validator = false
skip-build = false

[test.validator]
url = "https://api.devnet.solana.com"
commitment = "confirmed"
websocket = "wss://api.devnet.solana.com"
disable-blockhash-caching = false
preflight-commitment = "confirmed"

[test.validator.binary]
version = "1.18.17"
bind_address = "127.0.0.1"
dynamic_port_range = "1024-65535"
gossip_host = "127.0.0.1"
rpc_port = 8899
websocket_port = 8900
faucet_port = 9900
limit_ledger_size = 50000000
rpc_pubsub_enable_block_subscription = true
accounts = []
account_dir = []
snapshot_interval_slots = 200
no_bpf_jit = false
no_rocksdb_compaction = false
rocksdb_compaction_style = "level"
rocksdb_compression_type = "lz4"
rocksdb_max_open_files = 512
rocksdb_cache_size = 1073741824
rocksdb_block_cache_size = 1073741824
rocksdb_write_buffer_size = 67108864
rocksdb_max_write_buffer_number = 3
rocksdb_target_file_size_base = 67108864
rocksdb_max_bytes_for_level_base = 268435456
rocksdb_level0_slowdown_writes_trigger = 20
rocksdb_level0_stop_writes_trigger = 36
rocksdb_max_background_jobs = 2
rocksdb_max_subcompactions = 1
rocksdb_use_direct_reads = false
rocksdb_use_direct_io_for_flush_and_compaction = false
enable_rpc_transaction_history = false
enable_extended_tx_metadata_storage = false
no_wait_for_vote_to_start_leader = false
wait_for_supermajority = 0
expected_bank_hash = ""
expected_genesis_hash = ""
expected_shred_version = 0
halt_at_slot = 0
accounts_hash_interval_slots = 100
incremental_snapshot_interval_slots = 0
no_os_network_stats_reporting = false
no_os_cpu_stats_reporting = false
no_os_memory_stats_reporting = false
accounts_db_caching_enabled = true
accounts_db_test_hash_calculation = false
accounts_db_skip_shrink = false
frozen_aborted_polls = false
no_portable = false
enable_cpi_and_log_storage = true
enable_early_verification = false
